<!DOCTYPE html>

<body>

    <i class="orb" style="--c:#FFD35C;width:34vmax;height:34vmax;left:20vw;bottom:-16vmax;animation-delay:-13s"></i>
  </div>


  <header>
    <div class="w">
      <a class="logo" href="index.html"><b class="kr">한</b>Vamos Coreano</a>
      <nav aria-label="Principal">
        <a href="about.html">Sobre mí</a>
        <a href="class.html">Cursos</a>
        <a href="resource.html" class="on" aria-current="page">Recursos</a>
        <a href="contact.html">Contacto</a>

      </nav>
      <button id="th" aria-label="Cambiar tema claro u oscuro">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5"/>
          <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>

  <main id="top">
    <div class="resource-topline" aria-hidden="true"></div>

    <section class="resources-hero">
      <div class="w">

        <h1 class="rv">
          El coreano,<br>
          <em>por fin en tu idioma.</em>
        </h1>

               fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14M5 12l7 7 7-7"/>
          </svg>
        </a>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const items = document.querySelectorAll('.rv');
      const reducedMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches;

      if ('IntersectionObserver' in window && !reducedMotion) {
        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('vis');
              observer.unobserve(entry.target);
            }
          });
        }, {
          threshold: 0.12,
          rootMargin: '0px 0px -4% 0px'
        });

        items.forEach(item => observer.observe(item));
      } else {
        items.forEach(item => item.classList.add('vis'));
      }


    })();
  </script>
  <script src="js/nav.js"></script>
</body>
</html>
