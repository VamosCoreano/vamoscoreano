<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>VAMOS COREANO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Fondo: degradado nocturno con dos focos de luz que se desplazan y pulsan en bucle -->
  <div class="sky" aria-hidden="true">
    <div class="sky__drift"><div class="sky__glow"></div></div>
    <div class="sky__drift sky__drift--low"><div class="sky__glow sky__glow--teal"></div></div>
  </div>
  <!-- Hangul flotando (script.js rellena las palabras y oculta las que se acerquen al titular o al dock) -->
  <div class="hangul" aria-hidden="true">
    <span style="--x:5%;--y:7%;--s:6;--b:8px;--d:17s;--a:0.14"></span>
    <span style="--x:27%;--y:4%;--s:3;--b:2px;--d:13s;--a:0.18"></span>
    <span style="--x:50%;--y:11%;--s:4;--b:4px;--d:19s;--a:0.14"></span>
    <span style="--x:73%;--y:5%;--s:3;--b:2px;--d:12s;--a:0.18"></span>
    <span style="--x:88%;--y:13%;--s:5;--b:6px;--d:16s;--a:0.12"></span>
    <span style="--x:4%;--y:79%;--s:5;--b:5px;--d:18s;--a:0.12"></span>
    <span style="--x:25%;--y:89%;--s:3;--b:2px;--d:14s;--a:0.18"></span>
    <span style="--x:46%;--y:83%;--s:6;--b:9px;--d:21s;--a:0.1"></span>
    <span style="--x:68%;--y:90%;--s:3;--b:2px;--d:11s;--a:0.18"></span>
    <span style="--x:85%;--y:77%;--s:4;--b:4px;--d:15s;--a:0.14"></span>
    <span style="--x:2%;--y:45%;--s:4;--b:5px;--d:20s;--a:0.12"></span>
    <span style="--x:91%;--y:40%;--s:3;--b:3px;--d:13s;--a:0.16"></span>
  </div>

  <!-- Cristal que se ajusta a una palabra del fondo y la traduce (script.js) -->
  <div class="glass" aria-hidden="true"><span class="glass__text"></span></div>

  <div class="grain" aria-hidden="true"></div>

  <main class="stage">
    <h1 class="headline" aria-label="Habla, lee y escribe coreano">
      <span class="headline__word" id="dynamic-word">Habla</span>
      <span class="headline__fixed">Coreano</span>
    </h1>

    <!-- Dock estilo macOS: los iconos crecen un poco al acercar el puntero (script.js) -->
    <!-- PENDIENTE: enlazar cada opción a su sección cuando exista -->
    <nav class="dock" aria-label="Principal">
      <a class="dock__item" href="#nosotros">
        <svg class="dock__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM21 19v-1a4 4 0 0 0-3-3.87M16 3.13a3.5 3.5 0 0 1 0 6.75"/></svg>
        <span class="dock__label">Sobre Nosotros</span>
      </a>
      <a class="dock__item" href="#cursos">
        <svg class="dock__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14ZM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
        <span class="dock__label">Cursos</span>
      </a>
      <a class="dock__item" href="#contacto">
        <svg class="dock__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.15L4 21l1.85-5.4A8 8 0 1 1 21 12Z"/></svg>
        <span class="dock__label">Contacto</span>
      </a>
    </nav>
  </main>

</body>
</html>
